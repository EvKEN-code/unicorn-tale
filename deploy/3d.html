<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Мой единорожек — 3D-вид сказки</title>
<style>
:root{
  --ink:#3B4A63; --ink2:#7E8FA8; --card:#FFFFFF;
  --cw:270px; --ch:175px; --R:580px; --persp:1650px; --lift:-90px;
  --sh:0 6px 0 rgba(0,0,0,.18), 0 22px 40px rgba(20,30,60,.35);
  --shg:0 0 0 4px rgba(255,201,77,.95), 0 26px 54px rgba(20,30,60,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:'Comic Sans MS','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color:#EAF1FF; background:#101a33; user-select:none; -webkit-user-select:none;
}
/* фон-небо */
#sky{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(900px 520px at 50% 108%, rgba(255,214,150,.30), rgba(255,214,150,0) 70%),
    radial-gradient(700px 420px at 50% 46%, rgba(160,190,255,.20), rgba(160,190,255,0) 72%),
    linear-gradient(180deg,#0d1730 0%,#1b2a52 42%,#3a3560 72%,#5b3f63 100%);}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#stars i{position:absolute;background:#fff;border-radius:50%;opacity:.75}

/* затемнение по краям: обрезанные карточки уходят в фон, а не режутся об экран */
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(10,17,34,.94) 0%, rgba(10,17,34,0) 13%, rgba(10,17,34,0) 87%, rgba(10,17,34,.94) 100%),
    linear-gradient(180deg, rgba(10,17,34,.72) 0%, rgba(10,17,34,0) 15%, rgba(10,17,34,0) 74%, rgba(10,17,34,.80) 100%)}

/* сцена */
#stage{position:fixed;inset:0;z-index:2;perspective:var(--persp);perspective-origin:50% 46%;overflow:hidden}
#world{position:absolute;left:50%;top:46%;width:0;height:0;
  transform-style:preserve-3d;
  transform:rotateX(-7deg) rotateY(calc(var(--ry) * 1deg));}

/* пол-сетка */
#floor{position:absolute;width:2400px;height:2400px;left:-1200px;top:-1200px;
  transform:rotateX(90deg) translateZ(-150px);
  background:
    repeating-linear-gradient(0deg, rgba(150,190,255,.16) 0 1px, transparent 1px 80px),
    repeating-linear-gradient(90deg, rgba(150,190,255,.16) 0 1px, transparent 1px 80px);
  -webkit-mask-image:radial-gradient(closest-side, #000 12%, rgba(0,0,0,.55) 42%, transparent 72%);
  mask-image:radial-gradient(closest-side, #000 12%, rgba(0,0,0,.55) 42%, transparent 72%);
  opacity:.85}
#disc{position:absolute;width:560px;height:560px;left:-280px;top:-280px;border-radius:50%;
  transform:rotateX(90deg) translateZ(-146px);
  background:radial-gradient(closest-side, rgba(255,214,150,.30), rgba(255,214,150,0) 72%);}

/* кольцо экранов — поднято, чтобы внизу осталось место героине */
#ring{position:absolute;transform:translateY(var(--lift));transform-style:preserve-3d}

/* карточки экранов */
.card{position:absolute;width:var(--cw);height:var(--ch);
  left:calc(var(--cw) / -2); top:calc(var(--ch) / -2);
  transform-style:preserve-3d;
  transform:rotateY(calc(var(--i) * 36deg)) translateZ(var(--R));
  border-radius:18px;overflow:hidden;cursor:pointer;
  box-shadow:var(--sh);background:#0e1730;
  transition:box-shadow .35s ease, filter .35s ease;}
.card .art{position:absolute;inset:0}
.card .art svg{width:100%;height:100%;display:block}
.card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,30,0) 40%,rgba(8,14,30,.82) 100%)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 9px;
  display:flex;align-items:center;gap:8px}
.card .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.94);color:#3B4A63;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center}
.card .tt{font-weight:800;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1.15}
.card .dd{font-size:12px;color:#CFE0FF;margin-top:2px;line-height:1.2}
/* кнопка запуска — появляется только у экрана, который смотрит на зрителя */
.card .go{flex:0 0 auto;margin-left:auto;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(180deg,#FFE7A3,#FFC94D);color:#5A3E00;font-size:13px;
  display:flex;align-items:center;justify-content:center;padding-left:3px;
  opacity:0;transform:scale(.6);transition:opacity .3s ease,transform .3s ease}
.card.front .go{opacity:1;transform:scale(1)}
.card.front{box-shadow:var(--shg);filter:saturate(1.12) brightness(1.06)}
.card:not(.front){filter:saturate(.82) brightness(.82)}

/* героиня — на подиуме внизу, ПЕРЕД кольцом, лицом к зрителю */
#hero{position:absolute;left:-150px;top:-150px;width:300px;height:300px;
  transform-style:preserve-3d;
  transform:translateY(190px) translateZ(300px) rotateY(calc(var(--ry) * -1deg));}
#hero .glow{position:absolute;left:50%;top:76%;width:280px;height:64px;margin-left:-140px;
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,235,190,.45), rgba(255,235,190,0) 74%);}
#hero .uni{position:absolute;inset:0}
#hero .uni svg{width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 18px 26px rgba(10,18,40,.55))}

/* верхняя панель */
#bar{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:linear-gradient(180deg,rgba(8,14,30,.72),rgba(8,14,30,0))}
#bar h1{margin:0;font-size:clamp(17px,2.6vw,25px);font-weight:800;letter-spacing:.2px;
  text-shadow:0 2px 10px rgba(0,0,0,.5)}
#bar .sp{flex:1}
.btn{min-height:46px;padding:8px 16px;font-family:inherit;font-weight:800;font-size:15px;
  border:none;border-radius:16px;background:rgba(255,255,255,.14);color:#EAF1FF;cursor:pointer;
  backdrop-filter:blur(6px);box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s,background .2s}
.btn:hover{background:rgba(255,255,255,.22)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.on{background:linear-gradient(180deg,#FFE7A3,#FFC94D);color:#5A3E00}
.btn.play{background:linear-gradient(180deg,#FFE7A3,#FFC94D);color:#5A3E00;box-shadow:0 3px 0 #D89A22;
  font-size:16px;padding:8px 20px}
.btn.play:hover{filter:brightness(1.07)}
.btn.play.big{width:100%;margin-top:11px}

/* инфо-панель */
#info{position:fixed;left:16px;bottom:16px;z-index:6;max-width:min(430px,calc(100vw - 32px));
  background:rgba(12,20,40,.72);backdrop-filter:blur(10px);border-radius:20px;padding:14px 16px;
  box-shadow:0 16px 34px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.10)}
#info .k{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#9FB6E0}
#info .t{font-size:21px;font-weight:800;margin:3px 0 4px}
#info .d{font-size:15px;color:#CFE0FF;line-height:1.35}
#info .hint{font-size:12.5px;color:#8FA6CE;margin-top:9px}
#hint2{position:fixed;right:16px;bottom:16px;z-index:6;font-size:13px;color:#9FB6E0;
  text-align:right;line-height:1.5;max-width:230px}

@media (max-width:760px){
  :root{--cw:186px;--ch:120px;--R:400px;--persp:1080px;--lift:-56px}
  #hero{left:-104px;top:-104px;width:208px;height:208px;transform:translateY(150px) translateZ(210px) rotateY(calc(var(--ry) * -1deg))}
  #hero .glow{width:190px;height:44px;margin-left:-95px}
  .card .tt{font-size:13px}.card .dd{display:none}.card .num{width:21px;height:21px;font-size:12px}
  #hint2{display:none}
  #info{left:10px;right:10px;bottom:10px;max-width:none}
  #info .t{font-size:18px}#info .d{font-size:13.5px}
}
</style>
</head>
<body>
<div id="sky"></div>
<div id="stars"></div>
<div id="vig"></div>

<div id="stage">
  <div id="world">
    <div id="floor"></div>
    <div id="disc"></div>
    <div id="ring"></div>
    <div id="hero"><div class="glow"></div><div class="uni"></div></div>
  </div>
</div>

<div id="bar">
  <h1>Мой единорожек · 3D-вид сказки</h1>
  <div class="sp"></div>
  <button class="btn play" id="bPlay">▶ Играть</button>
  <button class="btn" id="bPrev">◀</button>
  <button class="btn on" id="bAuto">Авто-вращение</button>
  <button class="btn" id="bNext">▶</button>
</div>

<div id="info">
  <div class="k" id="iK">Экран 1 из 10</div>
  <div class="t" id="iT">Знакомство</div>
  <div class="d" id="iD">Погладить единорожку 5 раз</div>
  <button class="btn play big" id="bPlayHere">▶ Начать игру с этого экрана</button>
  <div class="hint" id="iH">Крути мышью или пальцем. Нажми на экран, чтобы приблизить, и ещё раз — чтобы начать с него.</div>
</div>
<div id="hint2">← → — перелистывать<br>Пробел — пауза вращения<br>Двойной клик по экрану — начать с него</div>

<script>
/* =========================================================
   ЧАСТЬ 1. ИСКУССТВО — то же самое, что в игре
   (вставляется скриптом сборки _build3d.js прямо из index.html)
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function svgWrap(inner,vb,cls){ return '<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" class="'+(cls||'')+'">'+inner+'</svg>'; }
function numWord(n,w){ const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return w[2]; if(b>1&&b<5) return w[1]; if(b===1) return w[0]; return w[2]; }


/* =========================================================
   F. РИСОВАНИЕ: ОБЩИЕ ДЕТАЛИ
   ========================================================= */
function cloud(x,y,s,o){
  return '<g transform="translate('+x+','+y+') scale('+s+')" opacity="'+(o==null?1:o)+'">'
    +'<ellipse cx="0" cy="4" rx="36" ry="20" fill="#FFFFFF"/>'
    +'<ellipse cx="32" cy="9" rx="27" ry="15" fill="#FFFFFF"/>'
    +'<ellipse cx="-30" cy="10" rx="25" ry="14" fill="#FFFFFF"/>'
    +'<ellipse cx="4" cy="-9" rx="24" ry="17" fill="#FFFFFF"/>'
    +'<ellipse cx="-12" cy="6" rx="26" ry="15" fill="#F7FBFF"/>'
    +'</g>';
}
function tree(x,y,s,c1,c2,trunk){
  const t=trunk||'#9A6B45';
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    +'<rect x="-7" y="-16" width="14" height="46" rx="6" fill="'+t+'"/>'
    +'<rect x="-7" y="-16" width="5" height="46" rx="2.5" fill="'+mixc(t,1.18)+'"/>'
    +'<ellipse cx="0" cy="-52" rx="46" ry="40" fill="'+c1+'"/>'
    +'<ellipse cx="-24" cy="-40" rx="28" ry="24" fill="'+mixc(c1,1.08)+'"/>'
    +'<ellipse cx="26" cy="-46" rx="26" ry="22" fill="'+mixc(c1,0.92)+'"/>'
    +'<ellipse cx="4" cy="-72" rx="28" ry="22" fill="'+c2+'"/>'
    +'<ellipse cx="-12" cy="-64" rx="16" ry="12" fill="'+mixc(c2,1.1)+'" opacity=".7"/>'
    +'</g>';
}
function pine(x,y,s,c1,c2){
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    +'<rect x="-6" y="-8" width="12" height="34" rx="5" fill="#8A5F3E"/>'
    +'<path d="M0 -104 L34 -46 L-34 -46 Z" fill="'+c1+'"/>'
    +'<path d="M0 -78 L42 -18 L-42 -18 Z" fill="'+c2+'"/>'
    +'<path d="M0 -50 L48 8 L-48 8 Z" fill="'+c1+'"/>'
    +'<path d="M-24 -30 L-8 -18 L-30 -12 Z" fill="'+mixc(c1,1.12)+'" opacity=".55"/>'
    +'</g>';
}
function flower(x,y,s,col,core){
  let p='<g transform="translate('+x+','+y+') scale('+s+')">';
  for(let i=0;i<5;i++) p+='<ellipse cx="0" cy="-9" rx="5.4" ry="9" fill="'+col+'" transform="rotate('+(i*72)+')"/>';
  p+='<circle cx="0" cy="0" r="5" fill="'+(core||'#FFC94D')+'"/>';
  p+='<circle cx="-1.6" cy="-1.6" r="1.8" fill="#FFF3C9"/>';
  return p+'</g>';
}
function grass(x,y,s,col){
  return '<g transform="translate('+x+','+y+') scale('+s+')" fill="'+(col||'#8BD98A')+'">'
    +'<path d="M0 0 q-6 -16 -14 -22 q10 4 14 14z"/>'
    +'<path d="M0 0 q0 -20 -2 -28 q8 10 6 28z"/>'
    +'<path d="M0 0 q7 -15 16 -19 q-9 8 -10 19z"/>'
    +'</g>';
}
function mixc(hex,k){
  const h=String(hex).replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r*k),0,255); g=clamp(Math.round(g*k),0,255); b=clamp(Math.round(b*k),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function shadeDefs(p){
  return '<filter id="'+p+'blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>'
       + '<filter id="'+p+'soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>';
}
/* Прядь волос: у корня широкая, к концу сходится в точку.
   Обычный stroke так не умеет — у него ширина постоянная, поэтому получаются «ленточки». */
function strandPath(x0,y0,c1x,c1y,c2x,c2y,x1,y1,w0){
  const dx=x1-x0, dy=y1-y0, L=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=-dy/L, ny=dx/L, h=w0/2;
  const ax=(x0+nx*h).toFixed(1), ay=(y0+ny*h).toFixed(1);
  const bx=(x0-nx*h).toFixed(1), by=(y0-ny*h).toFixed(1);
  return 'M'+ax+' '+ay+' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+x1+' '+y1
       + ' C'+c2x+' '+c2y+' '+c1x+' '+c1y+' '+bx+' '+by+' Z';
}
function strand(x0,y0,c1x,c1y,c2x,c2y,x1,y1,w0,fill,stroke,hi){
  let g='<path d="'+strandPath(x0,y0,c1x,c1y,c2x,c2y,x1,y1,w0)+'" fill="'+fill+'"';
  if(stroke) g+=' stroke="'+stroke+'" stroke-width="0.9" stroke-linejoin="round"';
  g+='/>';
  if(hi) g+='<path d="M'+x0+' '+y0+' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+x1+' '+y1
    +'" stroke="#FFFFFF" stroke-width="'+hi+'" fill="none" opacity=".5" stroke-linecap="round"/>';
  return g;
}

/* =========================================================
   G. ГЕРОИНЯ — ЕДИНОРОЖКА
   ========================================================= */
function unicornSVG(o){
  o=o||{};
  const mood=o.mood||'calm', mane=o.mane||'brushed', acc=o.acc||[];
  const sleeping=(mood==='sleepy');
  const OL='#CFDCF0';              /* обводка: белые формы читаются на белом фоне */
  const OL2='#B9C9E4';
  const TL='#B9A0E8';              /* обводка прядок */
  let s='';

  s+='<defs>'
   +'<linearGradient id="uBody" x1="0" y1="0" x2="0" y2="1">'
     +'<stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F7FAFF"/>'
     +'<stop offset="1" stop-color="#DCE6F8"/></linearGradient>'
   +'<linearGradient id="uNeck" x1="0" y1="0" x2="1" y2="1">'
     +'<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EBF9"/></linearGradient>'
   +'<linearGradient id="uLeg" x1="0" y1="0" x2="1" y2="0">'
     +'<stop offset="0" stop-color="#E1E9F7"/><stop offset=".5" stop-color="#FAFCFF"/>'
     +'<stop offset="1" stop-color="#D8E3F4"/></linearGradient>'
   +'<linearGradient id="uMuzzle" x1="0" y1="0" x2="1" y2="1">'
     +'<stop offset="0" stop-color="#FFF9F4"/><stop offset="1" stop-color="#F3E4DC"/></linearGradient>'
   +'<linearGradient id="uHorn" x1="0" y1="1" x2="1" y2="0">'
     +'<stop offset="0" stop-color="#E8A62E"/><stop offset=".45" stop-color="#FFDE84"/>'
     +'<stop offset="1" stop-color="#FFF8DF"/></linearGradient>'
   +'<linearGradient id="uMane" x1="0" y1="0" x2="1" y2="1">'
     +'<stop offset="0" stop-color="#FFC2E0"/><stop offset=".45" stop-color="#CDB8FF"/>'
     +'<stop offset="1" stop-color="#93DAFF"/></linearGradient>'
   +'<linearGradient id="uMane2" x1="0" y1="0" x2="1" y2="1">'
     +'<stop offset="0" stop-color="#FFE3F1"/><stop offset="1" stop-color="#B4D2FF"/></linearGradient>'
   +'<radialGradient id="uIris" cx=".38" cy=".3" r=".8">'
     +'<stop offset="0" stop-color="#A8E6FF"/><stop offset=".45" stop-color="#4C88DE"/>'
     +'<stop offset="1" stop-color="#22408A"/></radialGradient>'
   +'<radialGradient id="uRim" cx=".32" cy=".22" r=".7">'
     +'<stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>'
     +'<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>'
   +'<radialGradient id="uGlow" cx=".5" cy=".5" r=".5">'
     +'<stop offset="0" stop-color="#FFF0B8" stop-opacity=".75"/>'
     +'<stop offset="1" stop-color="#FFF0B8" stop-opacity="0"/></radialGradient>'
   +'</defs>';

  /* --- тень на земле --- */
  s+='<ellipse cx="126" cy="215" rx="88" ry="12" fill="#3B4A63" opacity=".16"/>';
  s+='<ellipse cx="126" cy="215" rx="58" ry="7" fill="#3B4A63" opacity=".11"/>';

  /* --- хвост: густая метёлка из прядей, сужаются к концу --- */
  const tail=[[86,112, 52,118, 34,144, 40,170, 20],
              [90,120, 56,128, 38,152, 44,182, 23],
              [92,130, 64,140, 46,160, 54,188, 17],
              [84,116, 46,124, 26,148, 32,166, 15],
              [94,124, 74,136, 58,156, 62,190, 12]];
  tail.forEach((v,i)=>{
    const col=(i%2)?'url(#uMane2)':'url(#uMane)';
    s+=strand(v[0],v[1],v[2],v[3],v[4],v[5],v[6],v[7],v[8],col,TL,2);
  });

  /* --- ноги (обе пары ДО корпуса, иначе их верхние срезы видны на теле) --- */
  s+='<path d="M92 156 q0 -3 3 -3 h8 q3 0 3 3 l-2 44 h-10 z" fill="#DDE6F6" stroke="'+OL+'" stroke-width="1.3"/>';
  s+='<rect x="90" y="198" width="16" height="11" rx="4.5" fill="#AFA0CE"/>';
  s+='<rect x="90" y="198" width="16" height="4" rx="2" fill="#C6B8DE" opacity=".7"/>';
  s+='<path d="M148 156 q0 -3 3 -3 h8 q3 0 3 3 l-2 44 h-10 z" fill="#DDE6F6" stroke="'+OL+'" stroke-width="1.3"/>';
  s+='<rect x="146" y="198" width="16" height="11" rx="4.5" fill="#AFA0CE"/>';
  s+='<rect x="146" y="198" width="16" height="4" rx="2" fill="#C6B8DE" opacity=".7"/>';
  s+='<path d="M104 154 q0 -3 3 -3 h10 q3 0 3 3 l-3 46 h-10 z" fill="url(#uLeg)" stroke="'+OL+'" stroke-width="1.3"/>';
  s+='<rect x="103" y="198" width="18" height="11" rx="5" fill="#B9A7D6"/>';
  s+='<rect x="103" y="198" width="18" height="4" rx="2" fill="#D2C4E8" opacity=".75"/>';
  s+='<path d="M162 154 q0 -3 3 -3 h10 q3 0 3 3 l-3 46 h-10 z" fill="url(#uLeg)" stroke="'+OL+'" stroke-width="1.3"/>';
  s+='<rect x="161" y="198" width="18" height="11" rx="5" fill="#B9A7D6"/>';

function rays(x,y,n,col,op){
  let s='';
  for(let i=0;i<n;i++){
    const a=-70+i*(140/(n-1));
    s+='<path d="M'+x+' '+y+' l'+(Math.cos(a*Math.PI/180)*600).toFixed(1)+' '+(Math.sin(a*Math.PI/180)*600).toFixed(1)+' l14 0 z" fill="'+col+'" opacity="'+(op||.16)+'"/>';
  }
  return s;
}
function fw(x,y,s,col){ /* маленький цветок на газоне */
  let p='<g transform="translate('+x+','+y+') scale('+s+')" opacity=".95">';
  for(let i=0;i<5;i++) p+='<ellipse cx="0" cy="-5" rx="3.2" ry="5" fill="'+col+'" transform="rotate('+(i*72)+')"/>';
  return p+'<circle r="2.4" fill="#FFD86A"/></g>';
}

      +'<path d="M-50 -20 q50 -22 100 0" stroke="#8A6B45" stroke-width="6" fill="none" opacity=".5"/>'
      +'</g>';
    /* гнездо с яйцами в кроне дерева */
    s+='<g transform="translate(700,272)">'
      +'<path d="M-46 0 q46 22 92 0 q-46 -14 -92 0z" fill="#C9A44C"/>'
      +'<path d="M-40 -6 q40 18 80 0" stroke="#B08C3C" stroke-width="4" fill="none"/>'
      +'<ellipse cx="-16" cy="-12" rx="11" ry="14" fill="#EAF7FF"/>'
      +'<ellipse cx="8" cy="-13" rx="11" ry="14" fill="#EAF7FF"/>'
      +'<ellipse cx="30" cy="-9" rx="10" ry="13" fill="#EAF7FF"/>'
      +'<circle cx="-19" cy="-14" r="2" fill="#BFD8E8"/><circle cx="5" cy="-16" r="2" fill="#BFD8E8"/>'
      +'</g>';
    /* пенёк */
    s+='<g transform="translate(250,452)">'
      +'<ellipse cy="0" rx="42" ry="14" fill="#8A5F3E"/>'
      +'<rect x="-42" y="0" width="84" height="34" rx="8" fill="#9A6B45"/>'
      +'<ellipse cy="0" rx="42" ry="14" fill="#C9A44C"/>'
      +'<ellipse cy="0" rx="26" ry="8" fill="none" stroke="#A8813A" stroke-width="2"/>'
      +'<ellipse cy="0" rx="12" ry="4" fill="none" stroke="#A8813A" stroke-width="2"/>'
      +'</g>';
    s+=grass(150,492,1.5)+grass(400,500,1.3)+grass(620,486,1.4);
    s+=fw(90,470,1.2,'#FF9EC4')+fw(360,486,1.2,'#FFF3C9')+fw(660,470,1.3,'#C9B6FF')+fw(520,500,1.1,'#FFB8D9');
    return svgWrap(s,'0 0 800 520');
  },

  /* 10. Радужный праздник */
  party:function(p){
    let s=shadeDefs(p);
    s+='<defs><linearGradient id="'+p+'sky" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="#B8E0FF"/><stop offset=".5" stop-color="#F2E4FF"/>'
      +'<stop offset="1" stop-color="#FFF0D8"/></linearGradient></defs>';
    s+='<rect width="800" height="520" fill="url(#'+p+'sky)"/>';
    s+='<g opacity=".6" fill="none" stroke-width="12">'
      +'<path d="M-40 448 A 440 320 0 0 1 840 448" stroke="#FF8F8F"/>'
      +'<path d="M-26 448 A 426 306 0 0 1 826 448" stroke="#FFC98F"/>'
      +'<path d="M-12 448 A 412 292 0 0 1 812 448" stroke="#FFF0A8"/>'
      +'<path d="M2 448 A 398 278 0 0 1 798 448" stroke="#A8E8A8"/>'
      +'<path d="M16 448 A 384 264 0 0 1 784 448" stroke="#A8D8FF"/>'
      +'<path d="M30 448 A 370 250 0 0 1 770 448" stroke="#C9B6FF"/>'
      +'<path d="M44 448 A 356 236 0 0 1 756 448" stroke="#FFB8D9"/>'
      +'</g>';
    /* гирлянда флажков */
    s+='<path d="M0 60 q200 60 400 10 q200 -50 400 20" stroke="#D8C4A0" stroke-width="3" fill="none"/>';
    const fcol=['#FF9EC4','#FFC94D','#8FD2FF','#A8E8A8','#C9B6FF','#FFB8D9'];
    for(let i=0;i<13;i++){
      const x=26+i*60, y=60+Math.sin(i/12*Math.PI)*44+ (i>6? (i-6)*3 : 0);
      s+='<path d="M'+x+' '+y+' l20 0 l-10 30z" fill="'+fcol[i%6]+'"/>';
    }
    /* шары */
    const bcol=['#FF8FBB','#FFC94D','#8FD2FF','#C9B6FF','#A8E8A8'];
    for(let i=0;i<5;i++){
      const x=90+i*156, y=170+(i%3)*34;
      s+='<line x1="'+x+'" y1="'+(y+34)+'" x2="'+x+'" y2="'+(y+96)+'" stroke="#C9B6FF" stroke-width="1.6" opacity=".7"/>';
      s+='<ellipse cx="'+x+'" cy="'+y+'" rx="27" ry="33" fill="'+bcol[i]+'"/>';
      s+='<ellipse cx="'+(x-9)+'" cy="'+(y-11)+'" rx="8" ry="11" fill="#FFFFFF" opacity=".5"/>';
      s+='<path d="M'+(x-5)+' '+(y+32)+' l5 8 l5 -8z" fill="'+mixc(bcol[i],0.85)+'"/>';
    }
    s+='<ellipse cx="180" cy="416" rx="360" ry="120" fill="#B8E8C0" opacity=".8"/>';
    s+='<ellipse cx="640" cy="412" rx="340" ry="116" fill="#9FE0A8"/>';
    s+='<path d="M0 424 q220 -28 430 2 q200 28 370 -10 v104 h-800z" fill="#A8E8A8"/>';
    s+='<path d="M0 470 q240 -18 460 6 q180 20 340 -6 v50 h-800z" fill="#8BD98A"/>';
    /* сцена-подиум */
    s+='<g transform="translate(400,432)">'
      +'<ellipse rx="150" ry="26" fill="#3B4A63" opacity=".13"/>'
      +'<path d="M-150 0 q150 -34 300 0 l-16 34 q-134 -26 -268 0z" fill="#F2B8D8"/>'
      +'<path d="M-150 0 q150 -34 300 0" stroke="#FFD9EA" stroke-width="6" fill="none"/>'
      +'<path d="M-134 34 q134 -26 268 0 l-10 20 q-124 -20 -248 0z" fill="#E8A0C8"/>'
      +'</g>';
    for(let i=0;i<16;i++) s+=fw(36+i*50+(i%2)*18, 462+(i%3)*20, 1.1+(i%4)*.2, fcol[i%6]);
    s+='<g opacity=".95">'
      +'<path d="M340 130 l3.4 10 l10 3.4 l-10 3.4 l-3.4 10 l-3.4 -10 l-10 -3.4 l10 -3.4z" fill="#FFC94D"/>'
      +'<path d="M470 108 l2.6 7.6 l7.6 2.6 l-7.6 2.6 l-2.6 7.6 l-2.6 -7.6 l-7.6 -2.6 l7.6 -2.6z" fill="#FFFFFF"/>'
      +'<path d="M250 210 l2.4 7 l7 2.4 l-7 2.4 l-2.4 7 l-2.4 -7 l-7 -2.4 l7 -2.4z" fill="#FFB8D9"/>'
      +'</g>';
    return svgWrap(s,'0 0 800 520');
  }
};
function setScene(name){
  const fn=SCENES[name]||SCENES.morning;
  const p='sc'+name+'_';
  const node=$('#scene');
  node.innerHTML='<svg viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'+fn(p)+'</svg>';
}

/* =========================================================
   ЧАСТЬ 2. 3D-ВИД
   ========================================================= */
const SCENES3D=[
  {n:1,  s:'morning',   t:'Знакомство', d:'Погладить единорожку 5 раз'},
  {n:2,  s:'meadow',    t:'Завтрак',    d:'Выбрать правильную еду 3 раза'},
  {n:3,  s:'lake',      t:'Купание',    d:'Стереть 6 пятен и смыть водой'},
  {n:4,  s:'glade',     t:'Грива',      d:'Расчесать 7 прядок и заплести косичку'},
  {n:5,  s:'forest',    t:'Прогулка',   d:'Пройти 6 точек тропы по порядку'},
  {n:6,  s:'rainbow',   t:'Украшение',  d:'Выбрать 3 украшения из 8'},
  {n:7,  s:'dandelion', t:'Игры',       d:'Лопнуть 8 мыльных пузырей'},
  {n:8,  s:'night',     t:'Сон',        d:'Одеяло, свет, 5 звёздочек колыбельной'},
  {n:9,  s:'burrow',    t:'Друзья',     d:'Накормить Пушка и Синичку'},
  {n:10, s:'party',     t:'Праздник',   d:'Салют и диплом заботы'}
];
const STEP=360/SCENES3D.length;   /* 36° между экранами */

const world=document.getElementById('world');
const ring=document.getElementById('ring');

/* небо: звёзды */
(function stars(){
  const box=document.getElementById('stars');
  let h='';
  for(let i=0;i<130;i++){
    const sz=(Math.random()*2+0.8).toFixed(1);
    h+='<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*72).toFixed(2)+'%;'
      +'width:'+sz+'px;height:'+sz+'px;opacity:'+(0.25+Math.random()*0.6).toFixed(2)+'"></i>';
  }
  box.innerHTML=h;
})();

/* карточки экранов */
const cards=[];
SCENES3D.forEach((sc,i)=>{
  const c=document.createElement('div');
  c.className='card';
  c.style.setProperty('--i', i);
  c.innerHTML='<div class="art">'+svgWrap(SCENES[sc.s]('c3d'+i+'_'),'0 0 800 520')+'</div>'
    +'<div class="veil"></div>'
    +'<div class="cap"><div class="num">'+sc.n+'</div>'
    +'<div><div class="tt">'+sc.t+'</div><div class="dd">'+sc.d+'</div></div>'
    +'<div class="go" title="Начать игру с этого экрана">▶</div></div>';
  /* первый клик — приблизить, второй (по уже переднему) — запустить игру */
  c.addEventListener('click',()=>{ if(i===front) startGame(i); else focusCard(i); });
  c.addEventListener('dblclick',()=>startGame(i));
  ring.appendChild(c);
  cards.push(c);
});

/* героиня на подиуме внизу */
document.getElementById('hero').querySelector('.uni').innerHTML=
  svgWrap(unicornSVG({mood:'happy',mane:'braid',dirt:false,clean:true,
                      acc:['bow','flower','star'],hearts:true}),'0 0 260 230');

/* --- вращение --- */
let ry=0, target=0, auto=true, dragging=false, dragX=0, dragStart=0, front=-1;
const info={k:document.getElementById('iK'),t:document.getElementById('iT'),d:document.getElementById('iD')};

function norm(a){ return ((a%360)+360)%360; }
function focusCard(i){
  auto=false; document.getElementById('bAuto').classList.remove('on');
  const want=-i*STEP;
  const d=((want-ry)%360+540)%360-180;      /* кратчайший путь, без прокрутки через весь круг */
  target=ry+d;
}
function step(dir){
  const cur=front<0?0:front;
  focusCard((cur+dir+SCENES3D.length)%SCENES3D.length);
}
function setInfo(i){
  if(i===front) return;
  front=i;
  cards.forEach((c,k)=>c.classList.toggle('front',k===i));
  const sc=SCENES3D[i];
  info.k.textContent='Экран '+sc.n+' из '+SCENES3D.length;
  info.t.textContent=sc.t;
  info.d.textContent=sc.d;
}

function frame(){
  if(!dragging){
    if(auto) target+=0.09;
    ry+=(target-ry)*0.10;
  }
  world.style.setProperty('--ry', ry.toFixed(2));
  /* кто сейчас к зрителю лицом */
  let best=0,bd=1e9;
  for(let i=0;i<cards.length;i++){
    const a=Math.abs(((norm(i*STEP+ry)+180)%360)-180);   /* 0 = смотрит на зрителя */
    if(a<bd){ bd=a; best=i; }
  }
  setInfo(best);
  requestAnimationFrame(frame);
}

/* --- ввод --- */
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{
  dragging=true; dragX=e.clientX; dragStart=ry;
  stage.setPointerCapture&&stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!dragging) return;
  ry=target=dragStart+(e.clientX-dragX)*0.32;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  stage.addEventListener(ev,()=>{ dragging=false; }));
stage.addEventListener('wheel',e=>{
  auto=false; document.getElementById('bAuto').classList.remove('on');
  target+=e.deltaY*0.06; e.preventDefault();
},{passive:false});

document.getElementById('bPrev').onclick=()=>step(-1);
document.getElementById('bNext').onclick=()=>step(1);
document.getElementById('bAuto').onclick=e=>{
  auto=!auto; e.target.classList.toggle('on',auto);
  if(auto) target=ry;
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')  step(-1);
  if(e.key==='ArrowRight') step(1);
  if(e.key===' '){ e.preventDefault(); document.getElementById('bAuto').click(); }
});

/* --- запуск самой игры --- */
const GAME='index.html';
function gameUrl(i){ return GAME+'#s='+((i|0)+1); }   /* игра поймёт #s=N и откроет нужный экран */
function startGame(i){ location.href=gameUrl(i); }
document.getElementById('bPlay').onclick=()=>{ location.href=GAME; };
document.getElementById('bPlayHere').onclick=()=>{ if(front>=0) startGame(front); };

frame();

if(typeof module!=='undefined'&&module.exports) module.exports={SCENES3D,STEP,gameUrl};
</script>
</body>
