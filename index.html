<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Мой единорожек — игра-сказка</title>
<style>
:root{
  --ink:#3B4A63; --ink2:#7E8FA8; --card:#FFFFFF; --line:#E2ECF7;
  --pink:#FF9EC4; --pink2:#F26CA0; --lav:#C9B6FF; --mint:#8FE3C8; --sun:#FFC94D;
  --sh:0 5px 0 #D8E6F3, 0 14px 26px rgba(59,74,99,.14);
  --shp:0 5px 0 #D89A22, 0 14px 26px rgba(59,74,99,.2);
  --shg:0 5px 0 #C86A96, 0 14px 26px rgba(59,74,99,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:'Comic Sans MS','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color:var(--ink);overflow:hidden;user-select:none;background:#EAF3FF;
  -webkit-user-select:none;touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- верхняя панель ---------- */
#topbar{position:relative;z-index:8;display:flex;align-items:center;gap:10px;padding:10px 14px}
#topbar.hide{display:none}
.ico{width:54px;height:54px;flex:0 0 54px;border:none;border-radius:18px;background:rgba(255,255,255,.9);
  font-size:24px;cursor:pointer;box-shadow:0 4px 0 #D8E6F3;color:var(--ink);line-height:1}
.ico:active{transform:translateY(3px);box-shadow:0 1px 0 #D8E6F3}
.ico.off{opacity:.45}
#progWrap{position:relative;flex:1;height:38px;min-width:70px;background:rgba(255,255,255,.9);
  border-radius:19px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(59,74,99,.12)}
#progFill{height:100%;width:0%;border-radius:19px;background:linear-gradient(90deg,#FFD9EA,#FF9EC4,#C9B6FF);transition:width .55s cubic-bezier(.3,1.4,.5,1)}
#progText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
#stars{display:flex;gap:4px;flex:0 0 auto}
.st{width:22px;height:22px;background:#DCE8F5;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  opacity:.5;transition:.4s}
.st.on{background:linear-gradient(180deg,#FFE9A8,#FFB01F);opacity:1;filter:drop-shadow(0 0 7px rgba(255,190,60,.9))}

/* ---------- сцены ---------- */
main{position:relative;z-index:5;flex:1;min-height:0}
#scene{position:absolute;inset:0;z-index:0;overflow:hidden}
#scene svg{width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:4px 14px 16px;overflow-y:auto;overscroll-behavior:contain}
.screen.active{display:flex;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

h1{font-size:clamp(24px,5vw,42px);margin:4px 0 2px;text-align:center;
  text-shadow:0 2px 0 #fff,0 6px 14px rgba(59,74,99,.18)}
h2{font-size:clamp(19px,3.4vw,28px);margin:2px 0 10px;text-align:center}
.sub{color:#5B6C86;font-size:clamp(15px,2.3vw,20px);text-align:center;margin:0 0 10px;
  max-width:720px;text-shadow:0 1px 0 rgba(255,255,255,.85);font-weight:700}
.card{background:rgba(255,255,255,.93);border-radius:28px;padding:16px;box-shadow:var(--sh);width:100%;max-width:860px}
.btn{min-height:62px;padding:10px 26px;font-size:clamp(18px,2.6vw,23px);font-weight:700;font-family:inherit;
  border:none;border-radius:26px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--sh);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D8E6F3}
.btn.primary{background:linear-gradient(180deg,#FFE7A3,#FFC94D);box-shadow:var(--shp);color:#5A3E00}
.btn.pink{background:linear-gradient(180deg,#FFC6DD,#FF8FBB);box-shadow:var(--shg);color:#6B1F42}
.btn.ok{background:linear-gradient(180deg,#B9EFB6,#7BD98A);box-shadow:0 5px 0 #4EA85C,0 12px 22px rgba(59,74,99,.16);color:#14421C}
.btn.ghost{background:rgba(255,255,255,.8);box-shadow:0 4px 0 #D8E6F3}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}

/* ---------- героиня ---------- */
#petWrap{position:relative;width:min(76vw,340px);max-width:340px;margin:0 auto}
#petWrap svg{width:100%;height:auto;display:block;overflow:visible}
#petWrap.tap{cursor:pointer}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.breathe{animation:bob 3.2s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.shake{animation:shake .5s}
@keyframes happy{0%{transform:scale(1)}40%{transform:scale(1.09) rotate(-3deg)}100%{transform:scale(1)}}
.happy{animation:happy .6s}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-58px) scale(1.15)}}
.zzz{animation:zzz 3s linear infinite}

/* ---------- интерактив ---------- */
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.food{width:104px;height:104px;border:none;border-radius:26px;background:#fff;cursor:pointer;
  box-shadow:0 6px 0 #D8E6F3,0 12px 20px rgba(59,74,99,.13);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);
  transition:transform .1s}
.food:active{transform:translateY(4px)}
.food svg{width:62px;height:62px;display:block}
.food.yes{background:linear-gradient(180deg,#CBF3C4,#8BDD93);box-shadow:0 6px 0 #4EA85C}
.food.no{background:linear-gradient(180deg,#FFE0D2,#FFB79A);box-shadow:0 6px 0 #D9764C;opacity:.8}
.food.gone{opacity:.28;pointer-events:none}
.spots{position:absolute;inset:0}
.spot{position:absolute;width:34px;height:34px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#B99A72,#8A6B45);box-shadow:0 2px 6px rgba(0,0,0,.25);
  transition:transform .18s,opacity .25s}
.spot.gone{transform:scale(0);opacity:0}
.strand{position:absolute;width:26px;height:26px;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.001);
  transition:transform .2s}
.strand:after{content:'';position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.75);
  box-shadow:0 0 0 3px rgba(201,182,255,.85);transition:.3s}
.strand.gone:after{background:rgba(180,240,200,.9);box-shadow:0 0 0 3px rgba(120,210,150,.9)}
.dot{position:absolute;width:44px;height:44px;border-radius:50%;cursor:pointer;border:4px dashed rgba(255,255,255,.95);
  background:rgba(255,255,255,.28);box-shadow:0 3px 10px rgba(59,74,99,.2);transition:.25s}
.dot:active{transform:scale(.9)}
.dot.on{border-style:solid;border-color:#7BD98A;background:rgba(190,245,190,.75)}
.dot.next{animation:ring 1.1s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 3px 10px rgba(59,74,99,.2),0 0 0 rgba(255,201,77,0)}50%{box-shadow:0 3px 10px rgba(59,74,99,.2),0 0 24px rgba(255,201,77,1)}}
.bubble{position:absolute;width:52px;height:52px;border-radius:50%;cursor:pointer;pointer-events:auto;
  background:radial-gradient(circle at 33% 28%,#fff,rgba(214,236,255,.75) 62%,rgba(180,215,245,.55));
  box-shadow:inset -3px -4px 8px rgba(255,255,255,.9),0 3px 10px rgba(59,74,99,.16);border:2px solid rgba(255,255,255,.85)}
@keyframes float{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
.bubble.gone{animation:popOut .3s forwards}
@keyframes popOut{to{transform:scale(1.9);opacity:0}}
.accPick{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.accBtn{width:88px;height:88px;border:none;border-radius:24px;background:#fff;cursor:pointer;font-family:inherit;
  box-shadow:0 5px 0 #D8E6F3,0 10px 18px rgba(59,74,99,.12);display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;color:var(--ink);gap:2px}
.accBtn svg{width:52px;height:52px}
.accBtn.sel{outline:4px solid var(--sun);transform:translateY(-4px)}
.friend{width:150px;height:150px}
.friend svg{width:100%;height:100%;display:block}
.fbub{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#fff;border-radius:16px;
  padding:7px 12px;font-size:14px;font-weight:700;box-shadow:var(--sh);max-width:180px;text-align:center;
  z-index:4;animation:fadeIn .3s ease;line-height:1.25}
.bowl{display:flex;gap:26px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-top:6px}

/* ---------- награда ---------- */
.bigStar{font-size:clamp(60px,13vw,110px);line-height:1;animation:happy .8s}
.timer{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;background:rgba(255,255,255,.92);
  border-radius:18px;padding:6px 16px;font-weight:800;font-size:17px;box-shadow:var(--sh)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-24px);z-index:30;opacity:0;
  background:#fff;border-radius:20px;padding:12px 22px;font-weight:800;font-size:18px;box-shadow:var(--sh);
  transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:linear-gradient(180deg,#FFE0D2,#FFC3A6);color:#7A3A18}
#toast.ok{background:linear-gradient(180deg,#CBF3C4,#A5E7A6);color:#1C5B25}

/* ---------- меню ---------- */
#menu{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(59,74,99,.42);padding:20px}
#menu.on{display:flex}
#menu .card{max-width:460px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 4px;font-size:19px;font-weight:700}
.toggle{width:66px;height:36px;border-radius:18px;border:none;background:#D8E6F3;cursor:pointer;position:relative;transition:.2s}
.toggle:after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#7BD98A}
.toggle.on:after{left:34px}
.stat{color:var(--ink2);font-size:15px;text-align:center;margin-top:10px;line-height:1.5}

#fx{position:fixed;inset:0;z-index:25;pointer-events:none}
#fw{position:fixed;inset:0;z-index:26;pointer-events:none;display:none}

@media (max-width:520px){
  #petWrap{width:min(88vw,300px)}
  .food{width:84px;height:84px;border-radius:22px;font-size:12px}
  .food svg{width:50px;height:50px}
  .accBtn{width:74px;height:74px;border-radius:20px}
  .accBtn svg{width:42px;height:42px}
  .friend{width:118px;height:118px}
  .ico{width:48px;height:48px;flex:0 0 48px;font-size:21px;border-radius:16px}
  .st{width:18px;height:18px}
  #stars{gap:3px}
}
@media (max-width:400px){ .st{width:15px;height:15px} #progText{font-size:14px} }
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <header id="topbar">
    <button class="ico" id="btnMenu" title="Меню">☰</button>
    <div id="progWrap"><div id="progFill"></div><span id="progText"></span></div>
    <div id="stars"></div>
    <button class="ico" id="btnMusic" title="Музыка">🎵</button>
    <button class="ico" id="btnVoice" title="Озвучка">🔊</button>
  </header>
  <main id="stage"></main>
</div>

<div id="menu">
  <div class="card">
    <h2 style="margin-top:0">Меню</h2>
    <div class="mrow"><span>🎵 Музыка</span><button class="toggle on" id="tgMusic"></button></div>
    <div class="mrow"><span>🔊 Озвучка</span><button class="toggle on" id="tgVoice"></button></div>
    <div class="mrow"><span>✨ Звуки</span><button class="toggle on" id="tgSfx"></button></div>
    <div class="btnRow">
      <button class="btn ghost" id="btnCloseMenu">Закрыть</button>
      <button class="btn" id="btnRestart" style="color:#B04A2A">Начать сказку заново</button>
    </div>
    <div class="stat" id="menuStats"></div>
  </div>
</div>

<div id="toast"></div>
<div id="fx"></div>
<canvas id="fw"></canvas>

<script>
/* =========================================================
   A. УТИЛИТЫ
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function svgWrap(inner,vb,cls){ return '<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" class="'+(cls||'')+'">'+inner+'</svg>'; }
function numWord(n,w){ const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return w[2]; if(b>1&&b<5) return w[1]; if(b===1) return w[0]; return w[2]; }

/* =========================================================
   B. ЗВУК (WebAudio, без файлов)
   ========================================================= */
const A = {
  ctx:null, music:null, timer:null, step:0,
  ensure(){ if(this.ctx) return this.ctx;
    try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      this.ctx=new C(); if(this.ctx.state==='suspended') this.ctx.resume();
    }catch(e){ this.ctx=null; }
    return this.ctx; },
  tone(freq,dur,type,vol,delay){
    if(!S.settings.sfx) return;
    const c=this.ensure(); if(!c) return;
    const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol==null?0.14:vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  },
  sfx(kind){
    switch(kind){
      case 'click': this.tone(660,0.09,'triangle',0.1); break;
      case 'good':  this.tone(784,0.13,'sine',0.13); this.tone(1046,0.16,'sine',0.11,0.1); break;
      case 'bad':   this.tone(240,0.22,'sawtooth',0.08); this.tone(180,0.24,'sawtooth',0.07,0.1); break;
      case 'star':  this.tone(880,0.12,'sine',0.12); this.tone(1174,0.14,'sine',0.1,0.08); this.tone(1568,0.2,'sine',0.08,0.16); break;
      case 'splash':this.tone(420,0.3,'sine',0.07); this.tone(300,0.34,'sine',0.05,0.06); break;
      case 'win':   [523,659,784,1046,1318].forEach((f,i)=>this.tone(f,0.3,'sine',0.12,i*0.13)); break;
      case 'pop':   this.tone(1200,0.06,'sine',0.1); break;
      case 'sleep': [392,330,262].forEach((f,i)=>this.tone(f,0.6,'sine',0.08,i*0.35)); break;
    }
  },
  MELODY:[523,587,659,784,659,587,523,392,440,523,587,523],
  startMusic(){
    if(!S.settings.music) return; const c=this.ensure(); if(!c) return;
    this.stopMusic(); this.step=0;
    this.timer=setInterval(()=>{
      if(!S.settings.music){ this.stopMusic(); return; }
      const f=this.MELODY[this.step%this.MELODY.length];
      this.tone(f,0.5,'sine',0.045);
      if(this.step%2===0) this.tone(f/2,0.7,'triangle',0.03);
      this.step++;
    },430);
  },
  stopMusic(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } }
};

/* =========================================================
   C. ОЗВУЧКА (Web Speech API) — у каждого героя свой голос
   ========================================================= */
/* p — высота голоса, r — скорость речи, v — какой по счёту ru-голос брать */
const VOICES = {
  narr:{ p:1.02, r:0.90, v:0 },   /* рассказчик */
  uni :{ p:1.45, r:0.95, v:1 },   /* единорожка */
  bun :{ p:1.72, r:1.07, v:2 },   /* зайчонок Пушок */
  bir :{ p:2.05, r:1.18, v:3 },   /* птичка Синичка */
  but :{ p:1.88, r:1.02, v:1 }    /* бабочка */
};
const TTS = {
  on:true, ru:[], ready:false,
  init(){ try{
    if(!('speechSynthesis' in window)) return;
    const load=()=>{
      const vs=(window.speechSynthesis.getVoices()||[]);
      this.ru=vs.filter(v=>/^ru/i.test(v.lang)||/russian|русск/i.test(v.name));
      this.ready=this.ru.length>0;
    };
    load(); window.speechSynthesis.onvoiceschanged=load;
  }catch(e){} },
  voiceFor(tag){
    if(!this.ru.length) return null;
    const cfg=VOICES[tag]||VOICES.uni;
    return this.ru[cfg.v % this.ru.length] || this.ru[0];
  },
  say(text,onend,who){
    if(!S.settings.voice||!('speechSynthesis' in window)){ if(onend) setTimeout(onend,600); return; }
    const cfg=VOICES[who]||VOICES.uni;
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text).replace(/[🎵🎉💧✨🌙🫧🎆💖🥕🌾]/g,''));
      u.lang='ru-RU';
      const v=this.voiceFor(who); if(v) u.voice=v;
      u.rate=cfg.r; u.pitch=cfg.p;
      if(onend) u.onend=onend;
      window.speechSynthesis.speak(u);
    }catch(e){ if(onend) setTimeout(onend,600); }
  },
  stop(){ try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){} }
};

/* =========================================================
   D. СОСТОЯНИЕ
   ========================================================= */
const KEY='unicorn_story_v1';
function defSave(){
  return { screen:1, done:[], petName:'Радужка',
    clean:false, mane:'messy', acc:[], fed:0, washed:0, brushed:0, walked:0, bubbles:0, slept:false,
    friends:0, party:false, settings:{music:true,voice:true,sfx:true}, started:false };
}
let S = defSave();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{
    const raw=localStorage.getItem(KEY); if(!raw) return;
    const o=JSON.parse(raw); if(o&&typeof o==='object'){
      S=Object.assign(defSave(),o);
      S.settings=Object.assign({music:true,voice:true,sfx:true},o.settings||{});
      if(!Array.isArray(S.done)) S.done=[];
      if(!Array.isArray(S.acc)) S.acc=[];
    }
  }catch(e){ S=defSave(); } }

/* =========================================================
   E. МЕЛКИЕ ЭФФЕКТЫ
   ========================================================= */
function toast(msg,kind){
  const t=$('#toast'); t.textContent=msg; t.className='show '+(kind||'');
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.className=''; },2100);
}
function burst(x,y,emoji,n){
  const fx=$('#fx');
  for(let i=0;i<(n||9);i++){
    const s=el('span','',emoji||'✨');
    s.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;font-size:'+(18+rnd(18))+'px;pointer-events:none;'+
      'transition:transform .9s cubic-bezier(.2,.8,.4,1),opacity .9s;';
    fx.appendChild(s);
    const dx=(Math.random()*2-1)*110, dy=-60-Math.random()*110;
    requestAnimationFrame(()=>{ s.style.transform='translate('+dx+'px,'+dy+'px) scale(.4)'; s.style.opacity='0'; });
    setTimeout(()=>s.remove(),950);
  }
}
function centerOf(node){
  const r=node.getBoundingClientRect();
  return { x:r.left+r.width/2, y:r.top+r.height/2 };
}
function confetti(){
  const fx=$('#fx');
  const cols=['#FFC94D','#FF9EC4','#9ED8FF','#B6F0A8','#D7B9FF','#FFFFFF'];
  for(let i=0;i<44;i++){
    const s=el('span','');
    s.style.cssText='position:absolute;left:'+(Math.random()*100)+'vw;top:-24px;width:'+(7+rnd(8))+'px;height:'+(10+rnd(10))+
      'px;background:'+pick(cols)+';border-radius:3px;pointer-events:none;transition:transform 2.6s linear,opacity 2.6s;';
    fx.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform='translate('+((Math.random()*2-1)*70)+'px,'+(window.innerHeight+80)+'px) rotate('+(rnd(720)-360)+'deg)'; s.style.opacity='0'; });
    setTimeout(()=>s.remove(),2700);

function fireworks(){
  const c=$('#fw'); c.style.display='block';
  c.width=window.innerWidth; c.height=window.innerHeight;
  const g=c.getContext?c.getContext('2d'):null;
  if(!g){ c.style.display='none'; return; }
  const parts=[], colors=['#FFC94D','#FF9EC4','#9ED8FF','#B6F0A8','#FFE9A8','#D7B9FF','#FFFFFF'];
  function boom(x,y,col){
    for(let i=0;i<70;i++){
      const a=Math.random()*Math.PI*2, s=1+Math.random()*5.4;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col});
    }
  }
  let t=0;
  (function frame(){
    g.clearRect(0,0,c.width,c.height); t++;
    if(t%22===0) boom(80+Math.random()*(c.width-160),60+Math.random()*Math.max(80,c.height*0.5),pick(colors));
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.055; p.vx*=0.99; p.life-=0.011;
      g.globalAlpha=Math.max(0,p.life); g.fillStyle=p.col;
      g.beginPath(); g.arc(p.x,p.y,3.4,0,Math.PI*2); g.fill();
      if(p.life<=0) parts.splice(i,1);
    }
    g.globalAlpha=1;
    if(t<620) requestAnimationFrame(frame);
    else { g.clearRect(0,0,c.width,c.height); c.style.display='none'; }
  })();
  A.sfx('win');
}

function mixc(hex,k){
  const h=String(hex).replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r*k),0,255); g=clamp(Math.round(g*k),0,255); b=clamp(Math.round(b*k),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function rays(x,y,n,col,op){
  let s='';
  for(let i=0;i<n;i++){
    const a=-70+i*(140/(n-1));
    s+='<path d="M'+x+' '+y+' l'+(Math.cos(a*Math.PI/180)*600).toFixed(1)+' '+(Math.sin(a*Math.PI/180)*600).toFixed(1)+' l14 0 z" fill="'+col+'" opacity="'+(op||.16)+'"/>';
  }
  return s;
}
function fw(x,y,s,col){ /* маленький цветок на газоне */
  let p='<g transform="translate('+x+','+y+') scale('+s+')" opacity=".95">';
  for(let i=0;i<5;i++) p+='<ellipse cx="0" cy="-5" rx="3.2" ry="5" fill="'+col+'" transform="rotate('+(i*72)+')"/>';
  return p+'<circle r="2.4" fill="#FFD86A"/></g>';
}
function bush(x,y,s,c1,c2){
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    +'<ellipse cx="-18" cy="0" rx="22" ry="18" fill="'+c1+'"/>'
    +'<ellipse cx="16" cy="2" rx="20" ry="16" fill="'+c2+'"/>'
    +'<ellipse cx="0" cy="-12" rx="24" ry="18" fill="'+c1+'"/>'
    +'<ellipse cx="-6" cy="-16" rx="12" ry="9" fill="'+mixc(c1,1.12)+'" opacity=".7"/></g>';
}

/* =========================================================
   K. ЭКРАНЫ СКАЗКИ
   ========================================================= */
function head(t,sub){
  const f=el('div');
  f.appendChild(el('h1','',t));
  if(sub) f.appendChild(el('p','sub',sub));
  return f;
}
function petBox(o,small){
  const box=el('div'); box.id='petWrap';
  if(small){ box.style.width='min(46vw,180px)'; box.style.maxWidth='180px'; }
  const art=el('div'); art.id='petArt'; art.className='breathe';
  art.innerHTML=svgWrap(unicornSVG(o),'0 0 260 230');
  box.appendChild(art);
  return box;
}
function redrawPet(box,o){
  const art=box.querySelector('#petArt'); if(!art) return;
  art.innerHTML=svgWrap(unicornSVG(o),'0 0 260 230');
  art.classList.remove('happy','shake'); void art.offsetWidth;
}
function petOpts(extra){
  const o=Object.assign({mood:'calm', mane:S.mane, acc:S.acc, dirt:!S.clean, clean:S.clean},extra||{});
  return o;
}
function starBar(need,got){
  const w=el('div',''); w.style.cssText='display:flex;gap:6px;justify-content:center;margin:6px 0 2px';
  for(let i=0;i<need;i++){
    const s=el('div','st'+(i<got?' on':''));
    s.style.width='20px'; s.style.height='20px';
    w.appendChild(s);
  }
  return w;
}

   L. НАВИГАЦИЯ И ФИНАЛ
   ========================================================= */
function updateTop(){
  const w=$('#stars'); w.innerHTML='';
  for(let i=1;i<=10;i++){
    const s=el('div','st'+(S.done.indexOf(i)>=0?' on':''));
    w.appendChild(s);
  }
  $('#progFill').style.width=(S.done.length*10)+'%';
  $('#progText').textContent = S.done.length+' / 10 экранов';
  $('#btnMusic').classList.toggle('off',!S.settings.music);
  $('#btnVoice').classList.toggle('off',!S.settings.voice);
  $('#menuStats').textContent='Пройдено экранов: '+S.done.length+' из 10  •  Друзей: 4  •  Единорожка '+(S.clean?'чистая':'чумазая');
}
function renderFinal(){
  setScene('party');
  $('#topbar').classList.remove('hide');
  const stage=$('#stage'); stage.innerHTML='';
  const sec=el('section','screen active');
  sec.appendChild(head('🎉 Сказка пройдена!','Ты заботился о единорожке Радужке и стал её лучшим другом.'));
  const box=petBox(petOpts({mood:'happy',dirt:false,acc:S.acc.length?S.acc:['bow','star','flower'],hearts:true}),false);
  box.classList.add('bob');
  const card=el('div','card');
  card.innerHTML='<div style="text-align:center"><div class="bigStar">🏅</div>'
    +'<h2>Диплом заботы</h2>'
    +'<div class="stat" style="font-size:17px">Экранов пройдено: 10 из 10<br>Друзей: зайчонок Пушок, птичка Синичка и бабочка Крапинка<br>Звёзд собрано: 10</div></div>';
  const row=el('div','btnRow');
  const b1=el('button','btn primary','🎆 Ещё салют!');
  const b2=el('button','btn ghost','↺ Начать сказку заново');
  b1.onclick=()=>{ A.sfx('click'); fireworks(); confetti(); };
  b2.onclick=()=>restart();
  row.appendChild(b1); row.appendChild(b2);
  sec.appendChild(box); sec.appendChild(card); sec.appendChild(row);
  stage.appendChild(sec);
  A.sfx('win'); confetti();
  TTS.say('Ура! Ты прошёл всю сказку и позаботился обо мне. Ты настоящий друг!',null,'uni');
}
function render(){
  const stage=$('#stage'); stage.innerHTML='';
  $('#scene').style.filter='';
  updateTop();
  if(S.screen>10){ renderFinal(); return; }
  const def=SCREENS[S.screen-1];
  if(!def){ S.screen=1; return render(); }
  setScene(def.scene);
  const sec=el('section','screen active');
  stage.appendChild(sec);
  def.mount(sec, ()=>complete(def));
  if(def.intro) TTS.say(def.intro,null,def.introWho||'narr');
}
function complete(def){
  if(S.done.indexOf(def.id)<0){ S.done.push(def.id); }
  S.screen=Math.min(def.id+1,11);
  save(); updateTop();
  A.sfx('star'); confetti();
  setTimeout(()=>{
    if(S.screen>10) renderFinal();
    else { $('#scene').style.filter=''; render(); }
  },1900);
}
function restart(){
  const settings=S.settings;
  S=defSave(); S.settings=settings; S.started=true; save();
  $('#scene').style.filter='';
  A.sfx('click'); render();
  TTS.say('Начинаем сказку сначала!',null,'narr');
}

/* =========================================================
   M. ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
function init(){
  load();
  TTS.init();
  updateTop();
  $('#btnMusic').onclick=()=>{
    S.settings.music=!S.settings.music; save(); A.ensure();
    if(S.settings.music) A.startMusic(); else A.stopMusic();
    syncToggles(); updateTop(); A.sfx('click');
  };
  $('#btnVoice').onclick=()=>{
    S.settings.voice=!S.settings.voice; save(); syncToggles(); updateTop(); A.sfx('click');
    if(!S.settings.voice) TTS.stop();
  };
  $('#btnMenu').onclick=()=>{ A.sfx('click'); $('#menu').classList.add('on'); syncToggles(); updateTop(); };
  $('#btnCloseMenu').onclick=()=>{ A.sfx('click'); $('#menu').classList.remove('on'); };
  $('#btnRestart').onclick=()=>{ $('#menu').classList.remove('on'); restart(); };
  $('#tgMusic').onclick=()=>{ $('#btnMusic').click(); };
  $('#tgVoice').onclick=()=>{ $('#btnVoice').click(); };
  $('#tgSfx').onclick=()=>{ S.settings.sfx=!S.settings.sfx; save(); syncToggles(); A.sfx('click'); };
  document.addEventListener('click',function once(){
    A.ensure(); if(S.settings.music) A.startMusic();
    document.removeEventListener('click',once);
  });
  if(S.screen>10) renderFinal(); else render();
}
function syncToggles(){
  $('#tgMusic').classList.toggle('on',S.settings.music);
  $('#tgVoice').classList.toggle('on',S.settings.voice);
  $('#tgSfx').classList.toggle('on',S.settings.sfx);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

if(typeof module!=='undefined'&&module.exports){
  module.exports={unicornSVG,bunnySVG,birdSVG,butterflySVG,icon,SCENES,SCREENS,defSave,blanketSVG,mixc};
}
</script>
